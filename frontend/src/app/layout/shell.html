<div class="min-h-screen bg-surface">
  <nav class="sticky top-0 z-50 flex h-20 w-full items-center justify-between border-b border-outline-variant bg-surface-container-lowest px-8">
    <div class="flex items-center gap-12">
      <a routerLink="/dashboard" class="flex items-center gap-2">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary text-white">
          <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">account_balance</span>
        </div>
        <span class="text-[22px] font-bold text-primary">BujaBank</span>
      </a>

      <div class="hidden items-center gap-8 text-body-md text-on-surface-variant md:flex">
        <a
          routerLink="/dashboard"
          routerLinkActive="!text-primary !font-bold border-b-2 border-primary pb-1"
          class="pb-1 transition-colors hover:text-primary"
        >Dashboard</a>

        @if (!auth.isAdmin()) {
          <a
            routerLink="/deposits"
            routerLinkActive="!text-primary !font-bold border-b-2 border-primary pb-1"
            class="pb-1 transition-colors hover:text-primary"
          >Deposits</a>
          <a
            routerLink="/transfers"
            routerLinkActive="!text-primary !font-bold border-b-2 border-primary pb-1"
            class="pb-1 transition-colors hover:text-primary"
          >Transfers</a>
          <a
            routerLink="/payments"
            routerLinkActive="!text-primary !font-bold border-b-2 border-primary pb-1"
            class="pb-1 transition-colors hover:text-primary"
          >Payments</a>
        }

        @if (auth.isAgent()) {
          <a
            routerLink="/transactions"
            routerLinkActive="!text-primary !font-bold border-b-2 border-primary pb-1"
            class="pb-1 transition-colors hover:text-primary"
          >Transactions</a>
        }
      </div>
    </div>

    @if (auth.currentUser(); as user) {
      <div class="flex items-center gap-4">
        <div class="hidden text-right sm:block">
          <p class="text-body-md font-semibold text-on-surface">{{ user.username }}</p>
          <p class="text-label-md text-on-surface-variant">{{ roleLabel() }}</p>
        </div>
        <div class="flex h-9 w-9 items-center justify-center rounded-full bg-primary-container text-body-md font-bold text-white">
          {{ user.username.charAt(0).toUpperCase() }}
        </div>
        <button
          (click)="logout()"
          class="flex items-center gap-2 rounded-full bg-surface-container-high px-4 py-2 text-label-md text-on-surface-variant transition-colors hover:bg-error-container hover:text-on-error-container"
        >
          <span class="material-symbols-outlined text-lg">logout</span>
          <span class="hidden sm:inline">Sign out</span>
        </button>
      </div>
    }
  </nav>

  <main class="mx-auto max-w-container-max px-8 py-10">
    <router-outlet></router-outlet>
  </main>
</div>
