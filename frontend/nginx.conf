server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the backend container — keeps the SPA's relative /api/... calls,
    # the Django admin, the browsable API, and whitenoise-served static assets all reachable
    # through this one origin, whether it's opened from a host browser or a scanner container.
    location ~ ^/(api|admin|api-auth|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
